[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "killsheet"
version = "1.4.0"
description = "Free kill sheet calculator for oilfield hands (oilfield units, IADC rounding rules)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kirk Keel" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8", "openpyxl>=3.1"]
suite = ["openpyxl>=3.1"]

[tool.setuptools.packages.find]
where = ["src", "."]
include = ["killsheet*", "suite*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src", "."]
