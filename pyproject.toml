[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "killsheet"
version = "0.7.0"
description = "Free kill sheet calculator for oilfield hands (oilfield units, IADC rounding rules)."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "Kirk Keel" }]
license = { text = "MIT" }
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
