# Publishes the web page to GitHub Pages - but ONLY after the Tests workflow
# has passed on every Python version for that exact commit on main.
name: Publish web page

on:
  workflow_run:
    workflows: [Tests]
    types: [completed]
    branches: [main]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}

    steps:
      - name: Get the code that was tested
        uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Install Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Build the page
        run: python web/build_site.py

      - name: Set up GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the page
        uses: actions/upload-pages-artifact@v5
        with:
          path: _site

      - name: Publish
        id: deploy
        uses: actions/deploy-pages@v5
