# Runs the test suite on GitHub's servers every time code is pushed
# (and on every pull request). A green check on GitHub means all tests passed.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test on every Python version the project supports.
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the calculator and pytest
        run: pip install -e ".[dev]"

      - name: Run the tests
        run: pytest -v
