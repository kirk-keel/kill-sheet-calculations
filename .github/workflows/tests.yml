# Runs the test suite on GitHub's servers every time code is pushed
# (and on every pull request). A green check on GitHub means all tests passed.
name: Tests

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # Test on every Python version the project supports (3.14 = the web page, Pyodide).
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Get the code
        uses: actions/checkout@v7

      - name: Install Python ${{ matrix.python-version }}
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install the calculator, suite dependencies and pytest
        run: pip install -e ".[dev,suite]"

      - name: Run the tests
        run: pytest -v

      - name: Run the example kill sheets
        run: |
          for well in examples/*_well.py; do python "$well"; done
          python examples/example_subsea.py
          python examples/example_tripping_slug.py
          python examples/example_kick_tolerance.py
          python examples/example_influx_identification.py
          python examples/example_tubular_buckling.py
          python examples/example_wellbore_hydraulics.py
          python examples/example_simulator.py
          python examples/example_gas_migration.py
          python examples/example_casing_design.py
          python examples/example_cement_plug.py

      - name: Build the engineering suite workbook
        run: python build.py

      - name: Build the web application distribution
        run: python web/build_site.py
